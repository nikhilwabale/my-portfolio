allowBuilds:
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - postcss@8.5.28
overrides:
  # next@16.2.12 still bundles its own old, vulnerable postcss/sharp internally even
  # after upgrading to the latest patched release - these force every resolution in the
  # tree to a fixed version regardless of what next itself declares. Safe to drop once a
  # future Next.js release bumps these on its own (check `pnpm audit` before removing).
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  nanoid: '>=3.3.18'
