name: Backend CI/CD

on:
  push:
    branches: ['**']

jobs:
  test:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/portfolio-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run test suite
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/portfolio-api/target/surefire-reports/

  docker-build:
    name: Build image & smoke-test the real stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Builds the same Dockerfile Render deploys from, and boots it against a real
      # Postgres via docker-compose.yml - the same file a contributor runs locally, so
      # this is verifying that file too, not a separate hand-rolled CI-only setup.
      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7000/health > /dev/null; then
              echo "Backend is up after ${i} attempt(s)."
              exit 0
            fi
            echo "Waiting for backend... (${i}/30)"
            sleep 2
          done
          echo "::error::Backend never became healthy within the timeout."
          exit 1

      - name: Confirm database connectivity through the running container
        run: curl -sf http://localhost:7000/health/db

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set. Add it under repo Settings -> Secrets and variables -> Actions. See DEPLOYMENT.md."
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
