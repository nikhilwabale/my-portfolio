# Activated via @ActiveProfiles("test"). DATABASE_URL is intentionally unset so
# DataSourceConfig's @ConditionalOnProperty stays off and Spring Boot's own
# auto-configured DataSource takes over, backed by an in-memory H2 instance here.
spring:
  datasource:
    url: jdbc:h2:mem:portfolio-api-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

cors:
  allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
